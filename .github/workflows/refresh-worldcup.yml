name: Refresh World Cup data

on:
  schedule:
    - cron: "31 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh-worldcup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://tobliao.github.io
      BASE_PATH: /compare-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Collect World Cup report
        run: npm run collect:worldcup

      - name: Validate static build
        run: npm run build:static

      - name: Upload World Cup crawl report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldcup-crawl-report
          path: data/worldcup/crawl-report.json
          if-no-files-found: error
