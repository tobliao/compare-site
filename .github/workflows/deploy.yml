name: Deploy static site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://tobliao.github.io
      BASE_PATH: /compare-site
      REQUIRE_LIVE_TRENDS: "true"
      REQUIRE_LIVE_OFFERS: "true"
      MIN_PRODUCTS_PER_CATEGORY: "20"
      MIN_PRICED_STORES_PER_PRODUCT: "2"
      DISCOVERY_SEEDS_PER_CATEGORY: "24"
      DISCOVERY_CANDIDATES_PER_CATEGORY: "36"
      DISCOVERY_CANDIDATES_PER_ADAPTER: "4"
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      CHISHA_TARGET_PLACES: "24"
      CHISHA_MAX_NEW_PLACES_PER_RUN: "0"
      CHISHA_MAX_PHOTOS_PER_PLACE: "1"
      CHISHA_SEARCH_RESULTS_PER_QUERY: "1"
      CHISHA_MAX_SEARCH_REQUESTS_PER_RUN: "0"
      CHISHA_MAX_PLACE_DETAILS_PER_RUN: "0"
      CHISHA_MAX_EXISTING_REFRESHES_PER_RUN: "0"
      CHISHA_MAX_CHANGED_PLACE_DETAILS_PER_RUN: "0"
      CHISHA_MAX_PHOTO_DOWNLOADS_PER_RUN: "0"
      CHISHA_REFRESH_EXISTING_AFTER_DAYS: "7"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Type check
        run: npm run check

      - name: Restore Chisha data cache
        uses: actions/cache@v4
        with:
          path: |
            data/chisha
            public/chisha/photos
          key: chisha-places-deploy-${{ github.run_id }}
          restore-keys: |
            chisha-places-

      - name: Build static site
        run: npm run build

      - name: Upload crawl report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-crawl-reports
          path: |
            data/crawl-report.json
            data/site.json
            data/worldcup/crawl-report.json
            data/chisha/crawl-report.json
            data/chisha/site.json
          if-no-files-found: warn

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
